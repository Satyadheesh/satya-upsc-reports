name: Top-news alerts (shadow)
run-name: "Alerts ${{ inputs.mode || 'hourly' }}"

# Finds the news an ordinary reader would want a notification about. SHADOW MODE: what it would notify goes to the
# admin Telegram chat only (TELEGRAM_TEST_CHAT_ID); nothing is sent to users. Started every hour by the orchestrator.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'hourly = normal run; summary = send the day so far to the admin chat; dry-run = print only'
        type: choice
        options: [hourly, summary, dry-run, dry-run-no-ai]
        default: hourly

concurrency:
  group: alerts
  cancel-in-progress: false

env:
  CORE_TOKEN: ${{ secrets.CORE_TOKEN }}
  SATYA_DB_URL: ${{ secrets.SATYA_DB_URL }}
  SATYA_DB_TOKEN: ${{ secrets.SATYA_DB_TOKEN }}
  SATYA_UPSC_DB_URL: ${{ secrets.NEW_UPSC_DB_URL }}
  SATYA_UPSC_DB_TOKEN: ${{ secrets.NEW_UPSC_DB_TOKEN }}
  SATYA_TRANSLATION_DB_URL: ${{ secrets.NEW_TRANSLATION_DB_URL }}
  SATYA_TRANSLATION_DB_TOKEN: ${{ secrets.NEW_TRANSLATION_DB_TOKEN }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_TEST_CHAT_ID: ${{ secrets.TELEGRAM_TEST_CHAT_ID }}
  KIT_MODEL_REPO: unsloth/gemma-4-12b-it-GGUF
  KIT_MODEL_FILE: gemma-4-12b-it-Q4_K_M.gguf
  MODE: ${{ github.event.inputs.mode || 'hourly' }}

jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}-core
          token: ${{ secrets.CORE_TOKEN }}
      - name: Free disk for model weights
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-kit-${{ hashFiles('requirements.txt') }}
      - name: Cache model weights   # the study kit's model: downloaded once, then restored
        uses: actions/cache@v4
        with:
          path: models
          key: gguf-${{ env.KIT_MODEL_FILE }}
      - name: Install
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
      - name: Schema (idempotent)
        run: python migrate.py
      - name: Pick
        run: |
          set -o pipefail
          case "$MODE" in
            summary) python -m alerts.pick --summary ;;
            dry-run) python -m alerts.pick --dry-run ;;
            dry-run-no-ai) python -m alerts.pick --dry-run --no-ai ;;
            *) python -m alerts.pick ;;
          esac 2>&1 | tee /tmp/out.txt
      - if: always()
        run: cat /tmp/out.txt >> "$GITHUB_STEP_SUMMARY" || true
