name: Archive report PDFs

on:
  schedule:
    - cron: '30 2 2 * *'   # 2nd of each month, 08:00 IST: the month that just ended
  workflow_dispatch:
    inputs:
      month:
        description: "Month to archive (YYYY-MM), 'all', or empty for last month"
        default: ''

env:
  CORE_TOKEN: ${{ secrets.CORE_TOKEN }}
  PYTHONPATH: ${{ github.workspace }}/.ci

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}-core
          token: ${{ secrets.CORE_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install libsql-client requests
      - name: Archive
        env:
          SATYA_UPSC_DB_URL: ${{ secrets.SATYA_UPSC_DB_URL }}
          SATYA_UPSC_DB_TOKEN: ${{ secrets.SATYA_UPSC_DB_TOKEN }}
          ARCHIVE_TOKEN: ${{ secrets.ARCHIVE_TOKEN }}
        run: PYTHONPATH=.:$PYTHONPATH python tools/archive_reports.py "${{ github.event.inputs.month }}"
