name: Script-only evaluation
on:
  workflow_dispatch:
    inputs:
      ids:
        description: Article IDs
        required: true
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SATYA_DB_URL: ${{ secrets.SATYA_DB_URL }}
      SATYA_DB_TOKEN: ${{ secrets.SATYA_DB_TOKEN }}
      SATYA_UPSC_DB_URL: ${{ secrets.NEW_UPSC_DB_URL || secrets.SATYA_UPSC_DB_URL }}
      SATYA_UPSC_DB_TOKEN: ${{ secrets.NEW_UPSC_DB_TOKEN || secrets.SATYA_UPSC_DB_TOKEN }}
      KIT_MODEL_REPO: unsloth/gemma-4-12b-it-GGUF
      KIT_MODEL_FILE: gemma-4-12b-it-Q4_K_M.gguf
      REEL_PIPELINE: grounded
      REEL_TEST_SHOW_SOURCE: '1'
      IDS: ${{ inputs.ids }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Satyadheesh/satya-upsc-reports-core
          ref: script-grounded-integration-20261109
          token: ${{ secrets.CORE_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -q libsql-client requests pytest
      - name: Unit and DB shutdown checks
        run: |
          case "$IDS" in *[!0-9,]*|'') exit 1;; esac
          python -m pytest -q tests/test_reel_intro.py tests/test_reel_grounded.py
          timeout 30s python -m tools.reel_grounded_exit_check
