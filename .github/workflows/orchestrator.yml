name: Orchestrator

# Starts the pipeline jobs when they are due: UPSC notes and SSC every 6 hours (each keeps looping until its
# backlog is done), the study kit, Hindi and PDF reports after new work (and at least every 6 hours), the nightly
# runs, the monthly archive, and a job's check when its prompt/model code changes. Never starts a job that is
# already running. Telegram and Instagram keep their own triggers.
# Started every hour by cron-job.org, by finished jobs, and by the schedule below as a backup.
on:
  schedule:
    - cron: '43 */3 * * *'   # backup only; the hourly start comes from cron-job.org
  workflow_dispatch:
    inputs:
      event:
        description: 'What happened (e.g. notes-done:<run id>); empty = regular check'
        default: ''
      dry_run:
        description: 'Only show what would be started'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write    # starts instagram-reel.yml for reels not on Instagram yet

concurrency:
  group: orchestrator
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}/.ci
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}-core
          token: ${{ secrets.CORE_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Start what is due
        env:
          SAT_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          HINDI_TOKEN: ${{ secrets.HINDI_DISPATCH_TOKEN }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}   # calls the site's timeline-follow notification job
        run: |
          python tools/orchestrator.py \
            ${{ github.event.inputs.event != '' && format('--event "{0}"', github.event.inputs.event) || '' }} \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      # Timelines the timeline service merged overnight: UPSC notes follow, the site refreshes its timeline caches once
      - name: Follow up on merged timelines
        if: ${{ github.event.inputs.dry_run != 'true' && github.event.inputs.event == '' }}
        continue-on-error: true
        env:
          SATYA_DB_URL: ${{ secrets.SATYA_DB_URL }}
          SATYA_DB_TOKEN: ${{ secrets.SATYA_DB_TOKEN }}
          SATYA_UPSC_DB_URL: ${{ secrets.NEW_UPSC_DB_URL }}
          SATYA_UPSC_DB_TOKEN: ${{ secrets.NEW_UPSC_DB_TOKEN }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          pip install -q libsql-client
          PYTHONPATH=.:$PYTHONPATH python tools/sync_timeline_merges.py

      # Reels made by Satyadheesh/reels that aren't on Instagram yet (their own signal can get lost): post them
      - name: Instagram reels catch-up
        if: ${{ github.event.inputs.dry_run != 'true' && github.event.inputs.event == '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/instagram-reel.yml/dispatches" \
            -d '{"ref":"main","inputs":{"run_id":"pending","dry_run":false,"gap":"20"}}' && echo "asked instagram-reel.yml to post pending reels"
