name: Reel storyboard pilot (test only, nothing posted)
run-name: "Reel storyboard pilot ${{ github.sha }}"
on:
  push:
    branches: ['pilot/reel-storyboard']
    paths: ['pilot.json']
permissions:
  contents: read
concurrency:
  group: reel-sb-pilot-${{ github.sha }}
  cancel-in-progress: false
env:
  CORE: Satyadheesh/satya-upsc-reports-core
  CODE_REF: pilot/reel-storyboard
  DATA_REF: pilot/reel-storyboard-data
  GK_REF: pilot/static-gk-v2-data
  SATYA_DB_URL: ${{ secrets.SATYA_DB_URL }}
  SATYA_DB_TOKEN: ${{ secrets.SATYA_DB_TOKEN }}
  SATYA_UPSC_DB_URL: ${{ secrets.NEW_UPSC_DB_URL || secrets.SATYA_UPSC_DB_URL }}
  SATYA_UPSC_DB_TOKEN: ${{ secrets.NEW_UPSC_DB_TOKEN || secrets.SATYA_UPSC_DB_TOKEN }}
  KIT_MODEL_REPO: unsloth/gemma-4-12b-it-GGUF
  KIT_MODEL_FILE: gemma-4-12b-it-Q4_K_M.gguf
  HF_HUB_DISABLE_TELEMETRY: '1'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      cfg: ${{ steps.p.outputs.cfg }}
      ids: ${{ steps.p.outputs.ids }}
      has_ids: ${{ steps.p.outputs.has_ids }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          python3 - <<'PY'
          import json, os
          c = json.load(open("pilot.json"))
          ids = [int(x) for x in c.get("ids", [])]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("cfg=" + json.dumps(c) + "\n")
              f.write("ids=" + json.dumps(ids or [0]) + "\n")
              f.write("has_ids=" + ("true" if ids else "false") + "\n")
          PY

  find:
    needs: plan
    if: ${{ fromJson(needs.plan.outputs.cfg).find }}
    runs-on: ubuntu-latest
    env:
      CFG: ${{ needs.plan.outputs.cfg }}
    steps:
      - uses: actions/checkout@v4
        with: {repository: '${{ env.CORE }}', ref: '${{ env.CODE_REF }}', token: '${{ secrets.CORE_TOKEN }}', path: code, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {repository: '${{ env.CORE }}', ref: '${{ env.DATA_REF }}', token: '${{ secrets.CORE_TOKEN }}', path: data}
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - run: pip install -q libsql-client
      - name: List candidate stories (counts only in this log)
        working-directory: code
        run: python -m tools.reel_sb --find --out ../out
      - name: Save privately
        working-directory: data
        run: |
          RUN=$(python3 -c "import json,os;print(json.loads(os.environ['CFG'])['run'])")
          mkdir -p "reels/$RUN" && cp ../out/find.md "reels/$RUN/find.md"
          git add reels
          git -c user.name=raam-07 -c user.email=282972983+raam-07@users.noreply.github.com commit -q -m "Reel storyboard pilot: candidates $RUN" || exit 0
          for i in 1 2 3 4 5; do git push -q origin "HEAD:$DATA_REF" && exit 0; git fetch -q origin "$DATA_REF" && git rebase -q "origin/$DATA_REF"; sleep $((i * 5)); done
          exit 1

  write:
    needs: plan
    if: ${{ needs.plan.outputs.has_ids == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 175
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJson(needs.plan.outputs.ids) }}
    env:
      CFG: ${{ needs.plan.outputs.cfg }}
    steps:
      - uses: actions/checkout@v4
        with: {repository: '${{ env.CORE }}', ref: '${{ env.CODE_REF }}', token: '${{ secrets.CORE_TOKEN }}', path: code, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {repository: '${{ env.CORE }}', ref: '${{ env.DATA_REF }}', token: '${{ secrets.CORE_TOKEN }}', path: data}
      - uses: actions/checkout@v4
        with: {repository: '${{ env.CORE }}', ref: '${{ env.GK_REF }}', token: '${{ secrets.CORE_TOKEN }}', path: gk, persist-credentials: false, sparse-checkout: static_gk/library}
      - name: Free disk for model weights
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - uses: actions/cache/restore@v4
        with: {path: code/models, key: 'gguf-${{ env.KIT_MODEL_FILE }}'}
      - name: Install
        run: pip install -q --only-binary=llama-cpp-python 'llama-cpp-python>=0.3.35,<0.4' huggingface-hub libsql-client --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
      - name: Gemma writes the storyboard (status only in this log)
        working-directory: code
        run: python -m tools.reel_sb --ids ${{ matrix.id }} --out ../out --lib ../gk/static_gk/library/static_gk.sqlite
      - name: Save privately
        if: always()
        working-directory: data
        run: |
          RUN=$(python3 -c "import json,os;print(json.loads(os.environ['CFG'])['run'])")
          ls ../out/*.json >/dev/null 2>&1 || exit 0
          for i in 1 2 3 4 5 6; do
            git fetch -q origin "$DATA_REF" && git reset -q --hard "origin/$DATA_REF"
            mkdir -p "reels/$RUN" && cp ../out/*.json ../out/*.md "reels/$RUN/"
            git add reels
            git -c user.name=raam-07 -c user.email=282972983+raam-07@users.noreply.github.com commit -q -m "Reel storyboard pilot: #${{ matrix.id }} ($RUN)" || exit 0
            git push -q origin "HEAD:$DATA_REF" && exit 0
            sleep $((i * 7))
          done
          exit 1
