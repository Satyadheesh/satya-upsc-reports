name: Universal Viral Reels Scorer (Gemma 4 12B)
run-name: "Reel Scorer ${{ inputs.batch && format('batch {0}', inputs.batch) || '30m' }}"

# Evaluates incoming news articles across all topics for viral potential (0 to 10)
# for Instagram Reels and YouTube Shorts. Stores results in reel_candidates (UPSC DB).
# Runs every 30 minutes parallel to sscca. Skips execution if an earlier run is still active.

on:
  schedule:
    - cron: '7,37 * * * *'   # every 30 min, parallel to sscca
  workflow_dispatch:
    inputs:
      batch:
        description: 'Number of articles to score'
        default: '30'
      dry_run:
        description: 'Print only (do not write to DB)'
        type: boolean
        default: false
      dispatch:
        description: 'Force dispatch to reels repo'
        type: boolean
        default: false
      reel_for:
        description: 'Special request: article id to make and post a reel for (every quality check still applies: best or nothing)'
        default: ''
      script_test:
        description: 'Article ids (comma-separated): write and review their reel scripts with Gemma, print only (slow)'
        default: ''
      luna_test:
        description: 'Test of the live script pipeline (B4r) only: article ids (comma-separated), "latest" (3 newest candidates) or "select" (old vs common-man picks + B5 scripts). Prints only, posts nothing'
        default: ''
      luna_effort:
        description: 'luna_test only: reasoning effort to try (low / medium / high); blank = the live setting'
        default: ''
      luna_model:
        description: 'luna_test only: model to try (gpt-5.6-luna / gpt-5.6-terra / gpt-5.6-sol); blank = the live model'
        default: ''
      edit_model:
        description: 'luna_test only: model for the plain-language editor pass (blank = same as the writer)'
        default: ''
      variant:
        description: 'luna_test only: prompt experiment (short / no_original / short-noedit / noedit); blank = live prompt'
        default: ''

concurrency:
  group: ${{ github.event.inputs.luna_test != '' && github.event.inputs.luna_test != null && format('reel-luna-test-{0}-{1}-{2}-{3}-{4}', github.event.inputs.luna_effort, github.event.inputs.luna_model, github.event.inputs.edit_model, github.event.inputs.variant, github.event.inputs.luna_test) || 'reel-scorer' }}
  cancel-in-progress: false

env:
  CORE_TOKEN: ${{ secrets.CORE_TOKEN }}
  SATYA_DB_URL: ${{ secrets.SATYA_DB_URL }}
  SATYA_DB_TOKEN: ${{ secrets.SATYA_DB_TOKEN }}
  SATYA_UPSC_DB_URL: ${{ secrets.NEW_UPSC_DB_URL || secrets.SATYA_UPSC_DB_URL }}
  SATYA_UPSC_DB_TOKEN: ${{ secrets.NEW_UPSC_DB_TOKEN || secrets.SATYA_UPSC_DB_TOKEN }}
  KIT_MODEL_REPO: unsloth/gemma-4-12b-it-GGUF
  KIT_MODEL_FILE: gemma-4-12b-it-Q4_K_M.gguf
  # Reels (live since 26 Oct 2026, Yash): REEL_SELECT v3 = any story a normal Indian would stop for, clear in 30 s,
  # guided by our real Instagram reach (India only, no violent crime, enforced in code); REEL_PIPELINE g1 = Gemma only
  # (no OpenAI): English notes -> Hindi script -> code checks -> fact check against the article -> editorial gate.
  # Best or nothing: a story that fails any check is skipped; no fallback. Rs 0 per reel.
  # Rollback without a code change: repo variables REEL_SELECT=v2 (or v1) and REEL_PIPELINE=b5 (or b4r).
  # Without a code change (repo variables): REEL_SCRIPT_EFFORT = low | medium | high; REEL_BUDGET_INR = runaway guard per reel (default 10).
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  REEL_SCRIPT_MODEL: gpt-5.6-luna
  REEL_SCRIPT_EFFORT: ${{ vars.REEL_SCRIPT_EFFORT || 'medium' }}
  REEL_PIPELINE: ${{ vars.REEL_PIPELINE || 'g1' }}
  REEL_SELECT: ${{ vars.REEL_SELECT || 'v3' }}
  REEL_BUDGET_INR: ${{ vars.REEL_BUDGET_INR || '10' }}
  # reels are made only in these Indian hours (06:30-22:30); a story found at night waits for the morning (31 Oct 2026)
  REEL_HOURS_IST: ${{ vars.REEL_HOURS_IST || '6.5-22.5' }}

jobs:
  luna_test:
    # Prints scripts, posts nothing. Without a Gemma variant ~1-2 min; Gemma variants (summary / B3 review loop) longer.
    if: github.event.inputs.luna_test != '' && github.event.inputs.luna_test != null
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}-core
          token: ${{ secrets.CORE_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -q libsql-client requests
      # the live pipeline (B4r) and most variants need Gemma 4 12B on the runner (same cache and install as the scorer job)
      - name: Free disk for model weights
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: models
          key: gguf-${{ env.KIT_MODEL_FILE }}
      - name: Install llama-cpp
        run: pip install -q -r requirements.txt --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
      - name: Luna scripts
        run: |
          IDS="${{ github.event.inputs.luna_test }}"; [ "$IDS" = latest ] && IDS=""
          SEL=""; [ "$IDS" = select ] && SEL=1 && IDS=""   # select: old vs new (common-man) picks + B5 scripts for the new top 3
          case "$IDS" in *[!0-9,]*) echo "::error::bad ids"; exit 1;; esac
          E="${{ github.event.inputs.luna_effort }}"; [ -n "$E" ] && export REEL_SCRIPT_EFFORT="$E"
          M="${{ github.event.inputs.luna_model }}"; [ -n "$M" ] && export REEL_SCRIPT_MODEL="$M" REEL_BUDGET_INR=40
          X="${{ github.event.inputs.edit_model }}"; [ -n "$X" ] && export REEL_EDIT_MODEL="$X" REEL_BUDGET_INR=40
          V="${{ github.event.inputs.variant }}"
          case "$V" in *noedit*) export REEL_EDIT_PASS=off;; *gedit*) export REEL_EDIT_PASS=gemma;; esac
          case "$V" in short*) export REEL_PROMPT_VARIANT=short;; no_original*) export REEL_PROMPT_VARIANT=no_original;; brief*) export REEL_PROMPT_VARIANT=brief;;
            tokdiag*) export REEL_PROMPT_VARIANT=tokdiag REEL_STREAM_NOTICES=1;; g1d*) export REEL_PROMPT_VARIANT=g1d;; g1*) export REEL_PROMPT_VARIANT=g1;; b5*) export REEL_PROMPT_VARIANT=b5;; b3*) export REEL_PROMPT_VARIANT=b3;; b4r*) export REEL_PROMPT_VARIANT=b4r;; b4*) export REEL_PROMPT_VARIANT=b4;; gemma_hi*) export REEL_PROMPT_VARIANT=gemma_brief_hi;; gemma_only*) export REEL_PROMPT_VARIANT=gemma_only;; gemma*) export REEL_PROMPT_VARIANT=gemma_brief;; esac
          if [ -n "$SEL" ]; then   # select: each block is an annotation as soon as it's ready (a long run may hit the time limit)
            REEL_STREAM_NOTICES=1 REEL_SELECT=v3 SELECT_TEST_SCRIPTS=5 python -m tools.reel_scorer --select-test 2>&1 | tee /tmp/lt.txt; exit 0
          fi
          python -m tools.reel_scorer --luna-test "$IDS" 2>&1 | tee /tmp/lt.txt
          i=0; awk '/^## /{n++} {print > "/tmp/lt_" n ".txt"}' /tmp/lt.txt
          for f in /tmp/lt_*.txt; do echo "::notice title=Luna script $(head -1 $f | cut -c4-30)::$(cut -c1-2200 $f | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"; done

  score:
    if: github.event.inputs.luna_test == '' || github.event.inputs.luna_test == null
    runs-on: ubuntu-latest
    timeout-minutes: 120   # scoring ~25 min + G1 scripts (~10-15 min per story); the script stops starting stories at 95 min
    permissions:
      contents: read
      actions: write       # "Keep looking" starts the next run
    steps:
      - name: Check if already running
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUNNING=$(gh run list --workflow=reel_scorer.yml --status=in_progress --json databaseId --jq 'length' || echo "0")
          if [ "$RUNNING" -gt 1 ]; then
            echo "Previous reel scorer run is still active ($RUNNING in progress). Skipping this run to prevent stacking."
            exit 0
          fi
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}-core
          token: ${{ secrets.CORE_TOKEN }}
      - name: Free disk for model weights
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-kit-${{ hashFiles('requirements.txt') }}
      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: models
          key: gguf-${{ env.KIT_MODEL_FILE }}
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
      - name: Ensure DB schema
        run: python migrate.py
      - name: Score viral reels candidates
        run: |
          BATCH="${{ github.event.inputs.batch || '30' }}"
          DRY="${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}"
          DISPATCH="${{ github.event.inputs.dispatch == 'true' && '--dispatch' || '' }}"
          REQ="${{ github.event.inputs.reel_for }}"
          if [ -n "$REQ" ]; then
            case "$REQ" in *[!0-9,]*) echo "::error::bad id"; exit 1;; esac
            REEL_PIPELINE=g1 REEL_SELECT=v3 python -m tools.reel_scorer --reel-for "$REQ" 2>&1 | tee /tmp/req.txt
            echo "::notice title=Requested reel::$(grep -E 'Requested|G1 |fact|Gemma review|rejected|not good|Dispatch|dispatch|posted|No ' /tmp/req.txt | tail -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
            exit 0
          fi
          TEST="${{ github.event.inputs.script_test }}"
          if [ -n "$TEST" ]; then
            case "$TEST" in *[!0-9,]*) echo "::error::bad ids"; exit 1;; esac
            python -m tools.reel_scorer --script-test "$TEST" 2>&1 | tee /tmp/st.txt
            echo "::notice title=Script test::$(tail -c 3500 /tmp/st.txt | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
            exit 0
          fi
          if [ -n "$DRY" ]; then
            python -m tools.reel_scorer --batch "$BATCH" $DRY $DISPATCH 2>&1 | tee /tmp/dry.txt
            # logs aren't readable from outside: the scores and the audience feedback as one annotation
            echo "::notice title=Dry run::$(grep -E 'Score|reach|Did |skipped' /tmp/dry.txt | tail -c 3800 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
          else
            python -m tools.reel_scorer --batch "$BATCH" $DRY $DISPATCH
          fi
      # A reel is due and none passed yet (or time ran out): start the next run right away instead of waiting for
      # GitHub's schedule, which starts this workflow only every few hours (31 Oct 2026). It stops by itself once a
      # reel is made, when no untried stories are left, or at night (reel hours, REEL_HOURS_IST).
      - name: Keep looking
        if: always() && (github.event_name == 'schedule' || (github.event.inputs.dry_run != 'true' && github.event.inputs.reel_for == '' && github.event.inputs.script_test == ''))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f /tmp/reel_again ] || exit 0
          echo "::notice title=Keep looking::$(cat /tmp/reel_again)"
          gh workflow run reel_scorer.yml --repo "${{ github.repository }}" -f batch=30 || true
