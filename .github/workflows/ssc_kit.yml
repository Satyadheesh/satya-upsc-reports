name: SSC CGL Flashcards (Gemma 4 12B)

# Generates high-yield active-recall SSC CGL General Awareness flashcards per note using Gemma 4 12B.
# Runs across 7 parallel runners and writes to the `ssc_kit` table in the UPSC DB.
on:
  workflow_dispatch:
    inputs:
      preview:
        description: 'Preview only: number of recent notes to try (0 = normal run, writes to the DB)'
        default: '0'
      batch:
        description: 'Notes per run (split over parallel runners)'
        default: '140'
      shards:
        description: 'Number of parallel runners/shards'
        default: '18'
      full:
        description: 'Scan the whole 30-day window, not just the last 3 days'
        type: boolean
        default: false
  # schedule: off — replaced by the SSC current-affairs runner (sscca.yml), which judges the raw news itself
  #   - cron: '25 * * * *'

concurrency:
  group: ssc-kit
  cancel-in-progress: false

env:
  CORE_TOKEN: ${{ secrets.CORE_TOKEN }}
  PYTHONPATH: ${{ github.workspace }}/.ci
  SATYA_DB_URL: ${{ secrets.SATYA_DB_URL }}
  SATYA_DB_TOKEN: ${{ secrets.SATYA_DB_TOKEN }}
  SATYA_UPSC_DB_URL: ${{ secrets.SATYA_UPSC_DB_URL }}
  SATYA_UPSC_DB_TOKEN: ${{ secrets.SATYA_UPSC_DB_TOKEN }}
  SATYA_TRANSLATION_DB_URL: ${{ secrets.SATYA_TRANSLATION_DB_URL }}
  SATYA_TRANSLATION_DB_TOKEN: ${{ secrets.SATYA_TRANSLATION_DB_TOKEN }}
  KIT_MODEL_REPO: unsloth/gemma-4-12b-it-GGUF
  KIT_MODEL_FILE: gemma-4-12b-it-Q4_K_M.gguf
  PREVIEW_N: ${{ github.event.inputs.preview || '0' }}

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.pick.outputs.shards }}
      more: ${{ steps.pick.outputs.more }}
      mode: ${{ steps.pick.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}-core
          token: ${{ secrets.CORE_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install libsql-client pytest
      - name: Check secrets
        run: |
          for s in SATYA_DB_URL SATYA_DB_TOKEN SATYA_UPSC_DB_URL SATYA_UPSC_DB_TOKEN; do
            [ -n "${!s}" ] || { echo "::error::Secret $s is not set in this repo"; exit 1; }
          done
      - name: Migrate schema (idempotent)
        run: python migrate.py
      - id: pick
        env:
          BATCH: ${{ github.event.inputs.batch || '140' }}
          FULL: ${{ github.event.inputs.full || 'false' }}
          SHARDS: ${{ github.event.inputs.shards || '18' }}
          RECENT_DAYS: '3'
        run: python -m kit.setup_ssc_shards

  kit:
    needs: setup
    if: ${{ needs.setup.outputs.shards != '[""]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        shard: ${{ fromJson(needs.setup.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}-core
          token: ${{ secrets.CORE_TOKEN }}
      - name: Free disk for model weights
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-kit-${{ hashFiles('requirements.txt') }}
      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: models
          key: gguf-${{ env.KIT_MODEL_FILE }}
      - name: Install
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
      - name: Generate SSC Flashcards
        env:
          SHARD_DEADLINE_SEC: '3000'
          SHARD_NAME: ${{ strategy.job-index }}
        run: |
          mkdir -p out
          set -o pipefail
          python -m kit.run_ssc --ids "${{ matrix.shard }}" ${{ env.PREVIEW_N != '0' && '--preview out' || '' }} 2>&1 | tee "out/log-${{ strategy.job-index }}.txt"
      - if: ${{ always() && env.PREVIEW_N != '0' }}
        uses: actions/upload-artifact@v4
        with:
          name: ssc-kits-${{ strategy.job-index }}
          path: out/
          if-no-files-found: ignore

  recompile_reports:
    needs: [setup, kit]
    if: ${{ !cancelled() && needs.kit.result == 'success' && needs.setup.outputs.mode != 'preview' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering automated report PDF recompilation..."
          gh workflow run reports.yml --repo "$GITHUB_REPOSITORY" --ref main -f scope=recent -f only=:ssc

