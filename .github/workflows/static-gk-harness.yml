name: Static GK panel test set
run-name: "Static GK panel test set ${{ inputs.label }}"
# 27 Nov 2026: the release bar for panels (static_gk/harness.py): 0 WRONG and coverage >= 70% on the fixed cases.
on:
  workflow_dispatch:
    inputs:
      code_ref: {description: 'core branch with the panel code', default: 'static-gk-live'}
      label: {description: 'name of this test run', default: 'manual'}
permissions:
  contents: read
concurrency:
  group: static-gk-harness
  cancel-in-progress: false
env:
  CORE: Satyadheesh/satya-upsc-reports-core
  CODE_REF: ${{ inputs.code_ref }}
  DATA_REF: pilot/static-gk-v2-data
  SATYA_DB_URL: ${{ secrets.SATYA_DB_URL }}
  SATYA_DB_TOKEN: ${{ secrets.SATYA_DB_TOKEN }}
  SATYA_UPSC_DB_URL: ${{ secrets.NEW_UPSC_DB_URL }}
  SATYA_UPSC_DB_TOKEN: ${{ secrets.NEW_UPSC_DB_TOKEN }}
  KIT_MODEL_REPO: unsloth/gemma-4-12b-it-GGUF
  KIT_MODEL_FILE: gemma-4-12b-it-Q4_K_M.gguf
  GK_MODEL_PATH: models/gemma-4-12b-it-Q4_K_M.gguf
  HF_HUB_DISABLE_TELEMETRY: '1'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.p.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
        with: {repository: '${{ env.CORE }}', ref: '${{ env.CODE_REF }}', token: '${{ secrets.CORE_TOKEN }}', path: code, persist-credentials: false}
      - id: p
        working-directory: code
        run: echo "ids=$(python3 -m static_gk.harness ids --shards 6)" >> "$GITHUB_OUTPUT"

  link:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        ids: ${{ fromJson(needs.plan.outputs.ids) }}
    env:
      PYTHONPATH: ${{ github.workspace }}/code/.ci:${{ github.workspace }}/code
      GK_DATA_DIR: ${{ github.workspace }}/data
    steps:
      - uses: actions/checkout@v4
        with: {repository: '${{ env.CORE }}', ref: '${{ env.CODE_REF }}', token: '${{ secrets.CORE_TOKEN }}', path: code, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {repository: '${{ env.CORE }}', ref: '${{ env.DATA_REF }}', token: '${{ secrets.CORE_TOKEN }}', path: data, persist-credentials: false}
      - name: Free disk for model weights
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - uses: actions/cache/restore@v4
        with: {path: code/models, key: 'gguf-${{ env.KIT_MODEL_FILE }}'}
      - name: Install
        run: |
          command -v pdftotext || (sudo apt-get update -q && sudo apt-get install -y -q poppler-utils)
          pip install -q --only-binary=llama-cpp-python 'llama-cpp-python>=0.3.35,<0.3.37' huggingface-hub pypdf libsql-client --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
      - name: Panels for the test notes (read-only)
        working-directory: code
        run: |
          python -m static_gk.link --db ../data/static_gk/library3/static_gk.sqlite --ids "${{ matrix.ids }}" --out ../out/link.jsonl --mode strict \
            --ondemand "../data/static_gk/checks/*/checks-*.jsonl" --checks-out ../out/checks.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'link-${{ strategy.job-index }}', path: out/link.jsonl, if-no-files-found: ignore, retention-days: 7}

  score:
    needs: link
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {repository: '${{ env.CORE }}', ref: '${{ env.CODE_REF }}', token: '${{ secrets.CORE_TOKEN }}', path: code, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {repository: '${{ env.CORE }}', ref: '${{ env.DATA_REF }}', token: '${{ secrets.CORE_TOKEN }}', path: data}
      - uses: actions/download-artifact@v4
        with: {path: in, pattern: 'link-*'}
      - name: Score
        working-directory: code
        run: python3 -m static_gk.harness score --glob "../in/*/link.jsonl" --out ../out/harness --label "${{ inputs.label }}-${{ github.run_id }}"
      - name: Save the report privately
        working-directory: data
        run: |
          L="${{ inputs.label }}-${{ github.run_id }}"
          for i in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$DATA_REF" && git reset -q --hard "origin/$DATA_REF"
            mkdir -p "static_gk/harness/$L" && cp ../out/harness/* "static_gk/harness/$L/" && cat ../in/*/link.jsonl > "static_gk/harness/$L/link.jsonl"
            git add static_gk/harness
            git -c user.name=raam-07 -c user.email=282972983+raam-07@users.noreply.github.com commit -q -m "Static GK panel test set $L" || exit 0
            git push -q origin "HEAD:$DATA_REF" && exit 0
            sleep $((i * 7))
          done
          exit 1
