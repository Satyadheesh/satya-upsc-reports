name: Static GK source reachability (private)
on:
  push:
    branches: ['pilot/static-gk-v2']
    paths: ['net.json']
permissions:
  contents: read
jobs:
  net:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {repository: 'Satyadheesh/satya-upsc-reports-core', ref: 'pilot/static-gk-v2-data', token: '${{ secrets.CORE_TOKEN }}', path: data}
      - name: Which official sources answer from here; fetch the matching PDFs privately
        run: |
          mkdir -p out
          python3 - <<'PY' > out/result.txt 2>&1 || true
          import json, re, time, urllib.request, urllib.parse, os
          cfg = json.load(open("net.json"))
          def get(u, n=60_000_000):
              t = time.time()
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"}), timeout=60)
                  b = r.read(n)
                  return r.status, b, round(time.time() - t, 1), r.headers.get("content-type", "")
              except Exception as e:
                  return str(e)[:80], b"", round(time.time() - t, 1), ""
          want = re.compile(cfg.get("pdf_match", "constitution|coi"), re.I)
          for u in cfg["urls"]:
              s, b, t, ct = get(u)
              print(f"{s} {len(b)} {t}s {ct[:30]} {u}", flush=True)
              if b[:15].lstrip().startswith(b"<"):
                  links = sorted(set(re.findall(rb'href="([^"]+\.pdf)"', b, re.I)))
                  for l in links[:40]:
                      l = urllib.parse.urljoin(u, l.decode(errors="replace"))
                      print("   pdf:", l[:200])
                      if want.search(l):
                          s2, b2, t2, _ = get(l)
                          name = re.sub(r"[^A-Za-z0-9._-]", "_", l.rsplit("/", 1)[-1])[-80:]
                          print(f"      fetched {s2} {len(b2)} {t2}s", flush=True)
                          if b2[:4] == b"%PDF":
                              os.makedirs("out/pdf", exist_ok=True)
                              open("out/pdf/" + name, "wb").write(b2)
          PY
      - name: Save privately
        if: always()
        working-directory: data
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            git fetch -q origin pilot/static-gk-v2-data && git reset -q --hard origin/pilot/static-gk-v2-data
            mkdir -p static_gk/net && cp -r ../out/* static_gk/net/ || true
            git add static_gk/net
            git -c user.name=raam-07 -c user.email=282972983+raam-07@users.noreply.github.com commit -q -m "Static GK: official source reachability" || exit 0
            git push -q origin HEAD:pilot/static-gk-v2-data && exit 0
            sleep $((i * 5))
          done
          exit 1
