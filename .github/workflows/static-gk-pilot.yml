name: Private fact-bank research pilot
on:
  push:
    branches: ['pilot/polity-factbank-20261112']
permissions:
  contents: read
jobs:
  pilot:
    strategy:
      fail-fast: false
      matrix:
        note: [147500, 150169]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NOTE_ID: ${{ matrix.note }}
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_XET: '1'
      GK_MODEL_PATH: models/gemma-4-12b-it-Q4_K_M.gguf
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Satyadheesh/satya-upsc-reports-core
          ref: 5466aeec7730900ea2ef466ef9358db22498ce35
          token: ${{ secrets.CORE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Check PDF extraction and retrieval accuracy
        run: |
          command -v pdftotext || (sudo apt-get update && sudo apt-get install -y poppler-utils)
          python pilot/static-gk/retrieval.py
      - name: Test source routing and quality gates
        run: python pilot/static-gk/factbank.py --check
      - name: Install Gemma runtime
        run: pip install --only-binary=llama-cpp-python 'llama-cpp-python>=0.3.35,<0.4' huggingface-hub --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
      - uses: actions/cache/restore@v4
        with:
          path: models
          key: gguf-gemma-4-12b-it-Q4_K_M.gguf
      - name: Obtain Gemma weights
        run: |
          if [ ! -s "$GK_MODEL_PATH" ]; then
            hf download unsloth/gemma-4-12b-it-GGUF gemma-4-12b-it-Q4_K_M.gguf --local-dir models
          fi
      - name: Generate and review learning box
        run: python -u pilot/static-gk/factbank.py
      - name: Save report privately
        if: always()
        env:
          GH_TOKEN: ${{ secrets.CORE_TOKEN }}
        run: |
          if [ -f pilot-results.md ]; then
            for attempt in 1 2 3 4 5; do
              if gh api --method PUT "repos/Satyadheesh/satya-upsc-reports-core/contents/pilot/static-gk/results/${GITHUB_RUN_ID}-${NOTE_ID}.md" \
                --field branch=pilot/polity-factbank-20261112 \
                --field "message=Save Polity pilot result ${GITHUB_RUN_ID} ${NOTE_ID}" \
                --field "content=$(base64 -w0 pilot-results.md)" --jq '.content.html_url'; then
                exit 0
              fi
              sleep "$((attempt * 3))"
            done
            exit 1
          fi
