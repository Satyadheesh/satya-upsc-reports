name: Book-grounded Polity pilot
on:
  push:
    branches: ['pilot/polity-book-20261112']
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_XET: '1'
      GK_MODEL_PATH: models/gemma-4-12b-it-Q4_K_M.gguf
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Satyadheesh/satya-upsc-reports-core
          ref: aada1f54002f62fe647f5e153fdf18ca41d57b33
          token: ${{ secrets.CORE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Test routing and citations
        run: python pilot/static-gk/run.py --check
      - name: Install Gemma runtime
        run: pip install --only-binary=llama-cpp-python 'llama-cpp-python>=0.3.35,<0.4' huggingface-hub --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
      - uses: actions/cache/restore@v4
        with:
          path: models
          key: gguf-gemma-4-12b-it-Q4_K_M.gguf
      - name: Obtain Gemma weights
        run: |
          if [ ! -s "$GK_MODEL_PATH" ]; then
            hf download unsloth/gemma-4-12b-it-GGUF gemma-4-12b-it-Q4_K_M.gguf --local-dir models
          fi
      - name: Generate and review learning boxes
        run: python -u pilot/static-gk/run.py
      - name: Save report privately
        if: always()
        env:
          GH_TOKEN: ${{ secrets.CORE_TOKEN }}
        run: |
          if [ -f pilot-results.md ]; then
            gh api --method PUT "repos/Satyadheesh/satya-upsc-reports-core/contents/pilot/static-gk/results/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.md" \
              --field branch=pilot/polity-book-20261112 \
              --field "message=Save Polity book pilot results (${GITHUB_RUN_ID})" \
              --field "content=$(base64 -w0 pilot-results.md)" --jq '.content.html_url'
          fi
