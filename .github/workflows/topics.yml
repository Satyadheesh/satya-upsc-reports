name: UPSC topic pages
run-name: "Topics: ${{ inputs.mode || 'assign' }}"

# Topic pages (tools/topics.py): discover = read-only list; apply = store chosen topics + write basics;
# assign = add new notes to their topics (the orchestrator can start this after new notes).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'discover | apply | assign'
        default: 'discover'
      pick:
        description: 'apply only: comma-separated slugs from the discover list, or top:N'
        default: ''
      auto_apply:
        description: 'discover only: then add the new topics that pass the rules (apply auto:10), no manual pick'
        type: boolean
        default: false
      name_limit:
        description: 'discover only: name at most this many groups (Gemma, about 2-3 min each)'
        default: '250'

concurrency:
  group: upsc-topics
  cancel-in-progress: false

env:
  CORE_TOKEN: ${{ secrets.CORE_TOKEN }}

jobs:
  topics:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:   # discover runs on several runners in parallel (8 Nov 2026: one runner named 55 of 227 groups)
        shard: ${{ fromJSON((inputs.mode == 'discover' || (inputs.mode == 'apply' && !startsWith(inputs.pick, 'auto:'))) && '[0,1,2,3,4]' || '[0]') }}   # discover and apply: 5 runners
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}-core
          token: ${{ secrets.CORE_TOKEN }}
      - name: Free disk for model weights
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Cache model weights   # Gemma 4 12B (free, on the runner), same cache as the study kit
        uses: actions/cache@v4
        with:
          path: models
          key: gguf-gemma-4-12b-it-Q4_K_M.gguf
      - name: Install
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          pip install numpy sentence-transformers scikit-learn
      - name: Run
        env:
          SATYA_UPSC_DB_URL: ${{ secrets.NEW_UPSC_DB_URL }}
          SATYA_UPSC_DB_TOKEN: ${{ secrets.NEW_UPSC_DB_TOKEN }}
          SATYA_DB_URL: ${{ secrets.SATYA_DB_URL }}
          SATYA_DB_TOKEN: ${{ secrets.SATYA_DB_TOKEN }}
          SATYA_TRANSLATION_DB_URL: ${{ secrets.NEW_TRANSLATION_DB_URL }}
          SATYA_TRANSLATION_DB_TOKEN: ${{ secrets.NEW_TRANSLATION_DB_TOKEN }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          TOPICS_MODE: ${{ inputs.mode || 'assign' }}
          TOPICS_PICK: ${{ inputs.pick }}
          TOPICS_NAME_LIMIT: ${{ inputs.name_limit || '250' }}
          TOPICS_MINUTES: '200'
          TOPICS_SHARD: ${{ (inputs.mode == 'discover' || (inputs.mode == 'apply' && !startsWith(inputs.pick, 'auto:'))) && format('{0}/5', matrix.shard) || '' }}   # 5 runners, every 5th item each
        run: |
          mkdir -p /tmp/diag_out
          set -o pipefail
          PYTHONPATH=. python tools/topics.py 2>&1 | tee /tmp/topics.log
      - name: Keep this shard's list for the finish job
        if: always() && inputs.mode == 'discover'
        uses: actions/upload-artifact@v4
        with:
          name: topics-shard-${{ matrix.shard }}
          path: |
            /tmp/diag_out/shard_*.json
            /tmp/topics.log
          retention-days: 3
      - name: Publish (previews branch, topics/)
        if: always() && inputs.mode != 'discover'
        run: |
          [ -f /tmp/topics.log ] || exit 0
          mkdir /tmp/wt && cd /tmp/wt && git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${CORE_TOKEN}@github.com/${GITHUB_REPOSITORY}-core.git"
          if git fetch -q --depth 1 origin previews; then git checkout -q -b previews FETCH_HEAD; else git checkout -q --orphan previews; fi
          mkdir -p topics && tail -c 900000 /tmp/topics.log > "topics/${{ inputs.mode == 'apply' && format('apply_{0}.log', matrix.shard) || 'latest.log' }}"
          cp /tmp/diag_out/topics.* topics/ 2>/dev/null || true
          git add -A && git commit -qm "topics ${GITHUB_RUN_ID}"
          for i in 1 2 3 4; do git push -q origin HEAD:previews && break; sleep $((i * 7)); git pull -q --rebase origin previews; done

  finish:   # discover only: merge the shards, merge duplicate topics, Hindi names, ranked list (read-only)
    needs: topics
    if: ${{ !cancelled() && inputs.mode == 'discover' }}   # partial shards are fine; a cancelled run is not
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write   # auto_apply starts the apply run
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}-core
          token: ${{ secrets.CORE_TOKEN }}
      - name: Free disk for model weights
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: models
          key: gguf-gemma-4-12b-it-Q4_K_M.gguf
      - name: Install
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          pip install numpy sentence-transformers scikit-learn
      - uses: actions/download-artifact@v4
        with:
          pattern: topics-shard-*
          path: /tmp/shards
      - name: Finish
        env:
          SATYA_UPSC_DB_URL: ${{ secrets.NEW_UPSC_DB_URL }}
          SATYA_UPSC_DB_TOKEN: ${{ secrets.NEW_UPSC_DB_TOKEN }}
          SATYA_DB_URL: ${{ secrets.SATYA_DB_URL }}
          SATYA_DB_TOKEN: ${{ secrets.SATYA_DB_TOKEN }}
          TOPICS_MODE: finish
          TOPICS_SHARD_DIR: /tmp/shards
          TOPICS_MINUTES: '60'
        run: |
          mkdir -p /tmp/diag_out
          set -o pipefail
          { for f in /tmp/shards/*/topics.log /tmp/shards/*/tmp/topics.log; do [ -f "$f" ] && grep -E '^\s+[+-] |shard|deadline' "$f"; done; } > /tmp/topics.log 2>/dev/null || true
          PYTHONPATH=. python tools/topics.py 2>&1 | tee -a /tmp/topics.log
      - name: Publish (previews branch, topics/)
        if: always()
        run: |
          [ -f /tmp/topics.log ] || exit 0
          mkdir /tmp/wt && cd /tmp/wt && git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${CORE_TOKEN}@github.com/${GITHUB_REPOSITORY}-core.git"
          if git fetch -q --depth 1 origin previews; then git checkout -q -b previews FETCH_HEAD; else git checkout -q --orphan previews; fi
          mkdir -p topics && tail -c 900000 /tmp/topics.log > topics/latest.log
          cp /tmp/diag_out/topics.* topics/ 2>/dev/null || true
          git add -A && git commit -qm "topics ${GITHUB_RUN_ID}" && git push -q origin HEAD:previews
      - name: Add the new topics that pass the rules (monthly, no manual pick)
        if: inputs.auto_apply
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run topics.yml --repo "${{ github.repository }}" -f mode=apply -f pick=auto:10
